# ルビカメラを GitHub Pages に公開する
#
# スマートフォンで使うにはカメラが必要で、ブラウザは https でないとカメラを渡さない。
# そのため配布は「ファイルを配る」ではなく「URLを配る」形にしている。
#
# 公開元は「GitHub Actions」。リポジトリの Settings → Pages で
# Source を GitHub Actions にしておくこと（初回のみ手作業が要る）。
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 読みの生成を検証する
        run: npm test

      - name: 配信する内容を組み立てる
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          set -eu
          rm -rf _site
          mkdir _site
          cp -r ./. _site/
          # 開発用のものと、コピーで紛れ込んだものは配信しない
          rm -rf _site/.git _site/.github _site/node_modules _site/dist _site/tests \
                 _site/build.mjs _site/package.mjs _site/package-lock.json _site/.gitignore \
                 _site/_site
          # 共有カードのプレビューは絶対URLでないと出ない
          sed -i "s#__SITE_URL__#${SITE_URL}#g" _site/index.html
          # Jekyll の処理を通さない
          touch _site/.nojekyll
          grep -o 'og:url" content="[^"]*"' _site/index.html
          echo "配信するファイル:"
          find _site -type f | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
